# ---------------------------------------------------------------------------
# TutorLink runtime configuration.
# Every value can be overridden from the command line, see docs/02-architecture.md
# ---------------------------------------------------------------------------

# false -> demo-version   : all the data live in RAM and are lost on exit
# true  -> full-version   : the data are written on the selected persistence layer
data.permanence=false

# MEMORY | FILE_SYSTEM | DBMS   (ignored, and forced to MEMORY, when data.permanence=false)
persistence.provider=MEMORY

# DESKTOP | COMPACT
gui.layout=DESKTOP

# Root directory used by the FILE_SYSTEM provider
filesystem.root=data

# Connection parameters used by the DBMS provider
jdbc.url=jdbc:mysql://localhost:3306/tutorlink?serverTimezone=UTC&useSSL=false
jdbc.user=tutorlink
jdbc.password=tutorlink

# Maximum amount of material a tutor can attach to a single lesson (bytes)
material.quota.bytes=20971520
