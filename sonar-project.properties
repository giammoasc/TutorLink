# Configurazione usata solo se si lancia lo scanner di Sonar da solo.
# Con Maven valgono invece le proprieta' scritte nel pom.xml.
sonar.projectKey=REPLACE-WITH-YOUR-SONAR-PROJECT-KEY
sonar.organization=REPLACE-WITH-YOUR-SONAR-ORG
sonar.projectName=TutorLink
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.sourceEncoding=UTF-8

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
